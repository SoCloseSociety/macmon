name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # compileall is cross-platform (a macmon_core/*.py glob does not expand on Windows)
      - name: Compile every module
        run: python -m compileall -q macmon.py macmon_core

      - name: Import every module
        run: |
          python -c "import macmon_core.autopilot, macmon_core.cleaner, macmon_core.config, macmon_core.dashboard, macmon_core.disk, macmon_core.docker_mgr, macmon_core.duplicates, macmon_core.gc, macmon_core.health, macmon_core.network, macmon_core.platform_compat, macmon_core.privacy, macmon_core.processes, macmon_core.security, macmon_core.sentinel, macmon_core.startup, macmon_core.uninstaller, macmon_core.utils; print('all modules import OK')"

      - name: Platform layer sanity
        run: |
          python -c "from macmon_core.platform_compat import OS_NAME, load_average, cache_dirs, temp_dirs, dns_flush_cmds, require_os; print('OS:', OS_NAME); print('load:', load_average()); print('cache:', [str(p) for p in cache_dirs()]); print('temp:', [str(p) for p in temp_dirs()]); print('dns:', dns_flush_cmds()); print('gate:', require_os('macOS'))"

      # Regression gate: psutil's Windows load sampler reports all-zero until it
      # warms up, which a one-shot CLI never does -- load must still be real.
      - name: load_average returns a real value (not the all-zero placeholder)
        run: python .github/scripts/check_load_average.py

      - name: CLI loads and lists commands
        run: python macmon.py --help

      # Read-only commands that must work on every platform
      - name: Smoke -- ps (JSON)
        run: python -c "import json,subprocess,sys; out=subprocess.run([sys.executable,'macmon.py','ps','--json'],capture_output=True,text=True); assert out.returncode==0, out.stderr; d=json.loads(out.stdout); assert isinstance(d,list); print('ps OK:',len(d),'processes')"

      - name: Smoke -- health (JSON, scored)
        run: python -c "import json,subprocess,sys; out=subprocess.run([sys.executable,'macmon.py','health','--json'],capture_output=True,text=True); assert out.returncode==0, out.stderr; d=json.loads(out.stdout); assert 0<=d['score']<=100; print('health OK:',d['score'],'/100 |',len(d['checks']),'checks')"

      - name: Smoke -- sentinel sample + console
        run: |
          python macmon.py sentinel --sample
          python macmon.py sentinel --status

      - name: Smoke -- disk analyzer
        run: python macmon.py disk .

      # Unit + regression suite: pure functions, cross-platform layer, and the
      # audited safety behaviors (ESC-drain, no Trash-to-permanent escalation).
      # Runs on all three OSes, so it also proves the tests themselves are portable.
      - name: Run test suite
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      # macOS-only commands must degrade with a message off-mac, never crash
      - name: macOS-only commands degrade cleanly (non-macOS)
        if: runner.os != 'macOS'
        run: python .github/scripts/check_degradation.py

  lint:
    name: lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pyflakes
      # Report only: unused imports and undefined names, not a hard gate yet
      - run: python -m pyflakes macmon.py macmon_core/ || true
